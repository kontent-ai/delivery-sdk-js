name: Test
on: [pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v2
      with:
        persist-credentials: false
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - run: npm i
    - run: npm run test:all
