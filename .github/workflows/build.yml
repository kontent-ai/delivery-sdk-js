name: Lint & Build

on:
    push:
        branches: [main]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - name: Use Node.js from .nvmrc file
              uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
